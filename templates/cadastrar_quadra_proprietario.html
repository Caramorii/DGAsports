{% load static %}
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar quadra | DGA Sports</title><link rel="stylesheet" href="{% static 'css/base.css' %}"><style>main{max-width:760px;margin:3rem auto;padding:2rem;background:var(--dark-card-bg);border:1px solid var(--border-color);border-radius:16px}label{display:block;margin:.9rem 0}input,textarea{box-sizing:border-box;width:100%;padding:.75rem;margin-top:.35rem;border-radius:8px;border:1px solid var(--border-color)}.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}button{margin-top:1rem;padding:.9rem 1.2rem;background:var(--primary-green);border:0;border-radius:8px;font-weight:700;cursor:pointer}.link{color:var(--primary-green)}select{box-sizing:border-box;width:100%;padding:.75rem;margin-top:.35rem;border-radius:8px;border:1px solid var(--border-color)}fieldset{margin:1rem 0;padding:.5rem 1rem 1rem;border:1px solid var(--border-color);border-radius:12px}legend{padding:0 .5rem;font-weight:700}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><main><p><a class="link" href="{% url 'painel_proprietario' %}">← Minha arena</a></p><h1>Cadastrar quadra</h1><p>A agenda será criada automaticamente para os próximos 7 dias.</p>
{% if messages %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% endif %}
<form method="post" enctype="multipart/form-data">{% csrf_token %}
<label>Nome do local<input name="nome" maxlength="200" required></label>
<label>Quantidade de quadras no local<input type="number" name="quantidade_quadras" min="1" max="30" value="1" required><small> Cada quadra terá seus próprios horários, esportes e vagas.</small></label>
<div id="lista-divisoes"></div>
<label>Descrição<textarea name="descricao" rows="3"></textarea></label>
<div class="row"><label>CEP<input name="cep" maxlength="9" placeholder="00000-000"></label><label>Cidade<input name="cidade" maxlength="100" required></label></div>
<div class="row"><label>Rua / endereço<input name="localizacao" maxlength="255" required></label><label>Número<input name="numero" maxlength="20"></label></div>
<label>Estado ou UF<input name="estado" maxlength="50" required></label>
<div class="row"><label>Abertura<input type="time" name="hora_abertura" required></label><label>Fechamento<input type="time" name="hora_fechamento" required></label></div>
<label>Preço por hora (R$)<input type="number" name="preco" min="0" step="0.01" required></label><label>Foto da quadra<input type="file" name="foto" accept="image/jpeg,image/png,image/webp" required></label><button type="submit">Cadastrar quadra e gerar agenda</button></form></main>
<template id="modelo-divisao"><fieldset><legend></legend><div class="row"><label>Nome da quadra<input name="divisao_nome" maxlength="100" required></label><label>Piso<select name="divisao_superficie"><option value="">Não informar</option>{% for valor, rotulo in superficies %}<option value="{{ valor }}">{{ rotulo }}</option>{% endfor %}</select></label></div><div class="row"><label>Esportes desta quadra (separados por vírgula)<input name="divisao_esportes" maxlength="200" placeholder="Basquete, Vôlei" required></label><label>Máximo de vagas por horário<input type="number" name="divisao_vagas" min="1" max="{{ vagas_limite }}" value="12" required></label></div></fieldset></template>
<script>const campoQuantidade=document.querySelector('[name="quantidade_quadras"]'),listaDivisoes=document.getElementById('lista-divisoes'),modeloDivisao=document.getElementById('modelo-divisao');function atualizarDivisoes(){const total=Math.min(Math.max(Number(campoQuantidade.value)||1,1),30);while(listaDivisoes.children.length>total)listaDivisoes.lastElementChild.remove();while(listaDivisoes.children.length<total){const numero=listaDivisoes.children.length+1,bloco=modeloDivisao.content.cloneNode(true);bloco.querySelector('legend').textContent=`Quadra ${numero}`;bloco.querySelector('[name="divisao_nome"]').value=`Quadra ${numero}`;listaDivisoes.append(bloco)}}campoQuantidade.addEventListener('input',atualizarDivisoes);atualizarDivisoes();</script>
<script>const cep=document.querySelector('[name="cep"]');cep.addEventListener('blur',()=>{const valor=cep.value.replace(/\D/g,'');if(valor.length!==8)return;fetch(`https://viacep.com.br/ws/${valor}/json/`).then(r=>r.json()).then(d=>{if(!d.erro){document.querySelector('[name="localizacao"]').value=d.logradouro||'';document.querySelector('[name="cidade"]').value=d.localidade||'';document.querySelector('[name="estado"]').value=d.uf||''}}).catch(()=>{});});</script></body></html>
