<!DOCTYPE html>
<html lang="pt-br">

<head>
  {% load static %}
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - Nova Quadra</title>
  <link rel="stylesheet" href="{% static 'css/admin_quadras.css' %}" />
</head>

<body>
  <h1>Cadastrar Nova Unidade</h1>
  
  <form action="{% url 'admin_cadastrar_quadra' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Identificação da Quadra -->
    <input type="text" id="nome" name="nome" placeholder="Nome da Quadra" required />
    <textarea id="descricao" name="descricao" placeholder="Descrição da Unidade"></textarea>
    <input type="text" name="esporte" placeholder="Esportes (Ex: Futebol, Tênis)" required />

    <hr />
    <h3>Endereço</h3>

    <!-- CEP -->
    <input type="text" id="cep" name="cep" placeholder="CEP (Ex: 14400-000)" maxlength="9" required />

    <!-- Rua e Número -->
    <div class="form-group">
      <input type="text" id="logradouro" name="localizacao" placeholder="Endereço / Rua" required />
      <input type="text" id="numero" name="numero" placeholder="Nº" required />
    </div>

    <!-- Cidade e Estado -->
    <div class="form-group">
      <input type="text" id="cidade" name="cidade" placeholder="Cidade" required />
      <input type="text" id="estado" name="estado" placeholder="Estado (Ex: SP)" maxlength="2" required />
    </div>

    <hr />
    <h3>Configuração de Horários</h3>
    
    <div class="form-group">
      <label>Abertura:</label>
      <input type="time" name="hora_abertura" required />

      <label>Fechamento:</label>
      <input type="time" name="hora_fechamento" required />
    </div>

    <label>Preço por Hora (R$):</label>
    <input type="number" step="0.01" name="preco" placeholder="Ex: 100.00" required />

    <label>Foto da Unidade:</label>
    <input type="file" name="foto" accept="image/*" required />

    <button type="submit">Cadastrar Quadra e Gerar Agenda</button>
  </form>

  <script>
    const cepInput = document.getElementById('cep');
    const logradouroInput = document.getElementById('logradouro');
    const numeroInput = document.getElementById('numero');
    const cidadeInput = document.getElementById('cidade');
    const estadoInput = document.getElementById('estado');

    cepInput.addEventListener('blur', () => {
      const cep = cepInput.value.replace(/\D/g, '');

      if (cep.length === 8) {
        logradouroInput.value = 'Buscando...';

        fetch(`https://viacep.com.br/ws/${cep}/json/`)
          .then(response => response.json())
          .then(data => {
            if (!data.erro) {
              logradouroInput.value = data.logradouro;
              cidadeInput.value = data.localidade;
              estadoInput.value = data.uf;
              numeroInput.focus();
            } else {
              alert('CEP não encontrado.');
              logradouroInput.value = '';
            }
          })
          .catch(() => {
            alert('Erro ao consultar o CEP.');
            logradouroInput.value = '';
          });
      }
    });
  </script>
</body>

</html>
